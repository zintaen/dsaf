name: Publish to npm (OIDC)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      major: ${{ steps.release_meta.outputs.major }}
      should_update_floating: ${{ steps.release_meta.outputs.should_update_floating }}
      skip_reason: ${{ steps.release_meta.outputs.skip_reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Run full verification & isolation suite
        run: npm test
      - name: Fetch git tags for release verification
        run: git fetch --tags --force origin
      - name: Verify tag matches package.json version & tarball excludes repo-only paths
        run: |
          node -e '
            const fs = require("fs");
            const { execFileSync } = require("child_process");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const expectedTag = "v" + pkg.version;
            const headSha = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
            if (process.env.GITHUB_REF_TYPE === "tag") {
              if (process.env.GITHUB_REF_NAME !== expectedTag) {
                console.error("Tag", process.env.GITHUB_REF_NAME, "does not match package.json", expectedTag);
                process.exit(1);
              }
            } else {
              const tagSha = execFileSync("git", ["rev-parse", "--verify", `refs/tags/${expectedTag}^{commit}`], { encoding: "utf8" }).trim();
              if (tagSha !== headSha) {
                console.error(`workflow_dispatch requires existing tag ${expectedTag} on HEAD (${headSha}), found ${tagSha}`);
                process.exit(1);
              }
            }
          '
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            const raw = execFileSync("npm", ["pack", "--dry-run", "--json"], { encoding: "utf8" });
            const arr = JSON.parse(raw);
            const files = Array.isArray(arr) && arr[0] && Array.isArray(arr[0].files) ? arr[0].files.map((f) => String(f.path || "")) : [];
            if (files.length === 0) {
              console.error("ERROR: npm pack --dry-run --json produced an empty file list.");
              process.exit(1);
            }
            const forbiddenRe = /^(?:docs|fixtures|scripts|examples|\.github)(?:\/|$)|^action\.yml$|(^|\/)(?:\.?evolve(?:\/|$)|\.DS_Store$)/i;
            const leaked = files.filter((p) => forbiddenRe.test(p));
            if (leaked.length > 0) {
              console.error("ERROR: non-publishable repo path(s) leaked into npm tarball:", leaked);
              process.exit(1);
            }
            console.log(`Tarball check passed: ${files.length} files, 0 forbidden paths.`);
          '
      - name: Determine npm dist-tag & floating major tag policy
        id: release_meta
        run: |
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs";
            import { execSync } from "node:child_process";
            import { parseSemver, compareSemver } from "./skill/scripts/update-check.mjs";

            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            const pkgTag = `v${pkg.version}`;
            const pPkg = parseSemver(pkgTag);
            if (!pPkg) {
              console.error(`Invalid package.json version: ${pkg.version}`);
              process.exit(1);
            }
            const major = `v${pPkg.major}`;

            const allTags = execSync("git tag -l \"v*.*.*\"", { encoding: "utf8" })
              .split(/\r?\n/)
              .map((s) => s.trim())
              .filter(Boolean);
            const stableTags = allTags.filter((t) => {
              const p = parseSemver(t);
              return Boolean(p && p.pre.length === 0);
            });

            let npmTag = "latest";
            if (pPkg.pre.length > 0) {
              npmTag = "next";
            } else if (stableTags.some((t) => compareSemver(pkgTag, t) === -1)) {
              npmTag = `maintenance-${major}`;
            }

            const refType = process.env.GITHUB_REF_TYPE || "";
            const ref = process.env.GITHUB_REF_NAME || "";
            const pRef = parseSemver(ref);
            let shouldUpdate = false;
            let skipReason = "is not a tag push";
            if (refType === "tag") {
              if (!pRef) {
                skipReason = "is not a valid semver tag";
              } else if (pRef.pre.length > 0) {
                skipReason = "is a pre-release tag";
              } else {
                const sameMajorStable = stableTags.filter((t) => {
                  const pt = parseSemver(t);
                  return pt && `v${pt.major}` === `v${pRef.major}`;
                });
                const behindMajor = sameMajorStable.some((t) => compareSemver(ref, t) === -1);
                if (behindMajor) {
                  skipReason = `is older than an existing v${pRef.major}.* tag`;
                } else {
                  shouldUpdate = true;
                  skipReason = "";
                }
              }
            }

            const outFile = process.env.GITHUB_OUTPUT;
            if (outFile) {
              appendFileSync(
                outFile,
                `npm_tag=${npmTag}\nmajor=${major}\nshould_update_floating=${shouldUpdate ? "true" : "false"}\nskip_reason=${skipReason}\n`
              );
            }
            console.log(`Release policy: version=${pkgTag} npm_tag=${npmTag} major=${major} should_update_floating=${shouldUpdate}`);
          '
      - name: Verify bundled npm supports OIDC Trusted Publishing (>= 11.5.1)
        run: |
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            import { parseSemver, compareSemver } from "./skill/scripts/update-check.mjs";
            const ver = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim();
            if (!parseSemver(ver) || compareSemver(ver, "11.5.1") < 0) {
              console.error(`ERROR: npm >= 11.5.1 required for OIDC Trusted Publishing (found ${ver}).`);
              process.exit(1);
            }
            console.log(`Bundled npm v${ver} satisfies >= 11.5.1 OIDC Trusted Publishing requirement.`);
          '
      - name: Publish @zintaen/dsaf with provenance
        env:
          NPM_TAG: ${{ steps.release_meta.outputs.npm_tag }}
        run: npm publish --provenance --access public --tag "$NPM_TAG"

  update-floating-tag:
    needs: publish
    if: github.ref_type == 'tag' && needs.publish.outputs.should_update_floating == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Update floating major tag (${{ needs.publish.outputs.major }})
        env:
          MAJOR: ${{ needs.publish.outputs.major }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR" "$TARGET_SHA"
          git push origin "refs/tags/$MAJOR" --force
