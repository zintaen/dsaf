name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test
      - run: node bin/dsaf.mjs version
      - run: node bin/dsaf.mjs audit --self-test
      - run: node skill/scripts/ci-report.mjs --self-test
      - run: node bin/dsaf.mjs hook --self-test
      - run: node bin/dsaf.mjs install-skill --self-test
      - run: node bin/dsaf.mjs doctor --self-test
      - run: node bin/dsaf.mjs figma-diff --self-test
      - run: node bin/dsaf.mjs guardrails --self-test
      - name: Verify live Preview Shell demo matches canonical skill shell
        run: cmp -s skill/resources/preview-shell.html docs/demo/preview-shell.html
      - name: Dogfood DSAF static checks on GitHub Pages site (docs/)
        run: |
          node bin/dsaf.mjs hook check docs/styles.css --tier all --report-unused-ignores
          node bin/dsaf.mjs hook check docs/index.html --tier floor
          node -e '
            const { execFileSync } = require("node:child_process");
            const out = JSON.parse(execFileSync(process.execPath, ["bin/dsaf.mjs", "tokens", "docs", "--json"], { encoding: "utf8" }));
            if (out.drift.hardcodedColorHits !== 0) {
              console.error("ERROR: hardcoded colors leaked outside :root in docs/:", out.drift.hardcodedColorHits);
              process.exit(1);
            }
            console.log("DOCS_TOKENS_CLEAN (hardcodedColorHits=0)");
          '
      - run: npm pack --dry-run
      - name: Smoke-test packed CLI tarball
        run: |
          PKG=$(npm pack --silent)
          npm install --prefix /tmp/dsaf-pkg-test "./$PKG"
          /tmp/dsaf-pkg-test/node_modules/.bin/dsaf version
          rm -rf /tmp/dsaf-pkg-test "$PKG"
      - run: node evolve/scripts/mine-signals.mjs --input evolve/fixtures/example-feedback.jsonl --scores-dir evolve/fixtures/calibration --format markdown

  runtime-playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Playwright & axe-core into isolated temp dir
        run: |
          mkdir -p /tmp/dsaf-pw
          npm install --prefix /tmp/dsaf-pw --no-save playwright axe-core
          /tmp/dsaf-pw/node_modules/.bin/playwright install chromium --with-deps
      - name: Verify Canonical Preview Shell, Storybook Static, Product App & Defect Detection
        env:
          NODE_PATH: /tmp/dsaf-pw/node_modules
        run: |
          node bin/dsaf.mjs runtime skill/resources/preview-shell.html --axe /tmp/dsaf-pw/node_modules/axe-core/axe.min.js
          node bin/dsaf.mjs runtime docs/demo/preview-shell.html --axe /tmp/dsaf-pw/node_modules/axe-core/axe.min.js
          node bin/dsaf.mjs runtime docs/index.html --live --skip-shell-check --extended-viewports --axe /tmp/dsaf-pw/node_modules/axe-core/axe.min.js
          node bin/dsaf.mjs runtime evolve/fixtures/synthetic/mode-p-app/index.html --live --axe /tmp/dsaf-pw/node_modules/axe-core/axe.min.js
          node bin/dsaf.mjs runtime --storybook evolve/fixtures/synthetic/storybook-static/index.json --axe /tmp/dsaf-pw/node_modules/axe-core/axe.min.js
          if node bin/dsaf.mjs runtime evolve/fixtures/synthetic/mode-p-defects/index.html --live --axe /tmp/dsaf-pw/node_modules/axe-core/axe.min.js; then
            echo "ERROR: defect fixture unexpectedly passed!"
            exit 1
          fi
          echo "DEFECT_FIXTURE_FAILED_AS_EXPECTED"
