name: "DSAF — Design System & UX/UI Audit"
description: "Run deterministic DSAF token, Figma drift, Floor/Reflex gate, SARIF 2.1.0 upload, and PR summary comments."
branding:
  icon: "check-circle"
  color: "blue"

inputs:
  target:
    description: "Target directory or package path to audit (subdirectories inside repo root automatically anchor to . via --scope)"
    required: false
    default: "."
  scope:
    description: "Optional monorepo sub-directory scope relative to target (e.g. apps/web)"
    required: false
    default: ""
  out-dir:
    description: "Directory where audit-summary.json and Markdown reports are written"
    required: false
    default: "dsaf-audit-output"
  sarif-file:
    description: "Output SARIF 2.1.0 file path (resolved relative to repo root / CWD; e.g. dsaf-audit-output/dsaf.sarif)"
    required: false
    default: "dsaf.sarif"
  fail-on-floor:
    description: "Fail the workflow if unwaivable Floor findings are active"
    required: false
    default: "true"
  run-doctor:
    description: "Also run read-only dsaf doctor diagnostic checks"
    required: false
    default: "false"
  upload-sarif:
    description: "Upload generated SARIF 2.1.0 report to GitHub Code Scanning"
    required: false
    default: "true"
  comment-pr:
    description: "Post or update a sticky DSAF summary comment on Pull Requests"
    required: false
    default: "true"
  node-version:
    description: "Node.js version to use when running DSAF"
    required: false
    default: "22"
  dsaf-version:
    description: "Version or npm tag of @zintaen/dsaf to execute ('bundled' uses this action's built-in CLI)"
    required: false
    default: "bundled"

outputs:
  summary-json:
    description: "Path to generated audit-summary.json"
    value: ${{ steps.audit.outputs.summary-json }}
  summary-md:
    description: "Path to generated audit-summary.md"
    value: ${{ steps.audit.outputs.summary-md }}
  sarif-path:
    description: "Path to generated SARIF 2.1.0 file"
    value: ${{ steps.audit.outputs.sarif-path }}
  floor-count:
    description: "Active unwaivable Floor defect count"
    value: ${{ steps.audit.outputs.floor-count }}
  reflex-count:
    description: "Active Reflex defect count"
    value: ${{ steps.audit.outputs.reflex-count }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Run DSAF Audit Pipeline
      id: audit
      shell: bash
      env:
        DSAF_TARGET: ${{ inputs.target }}
        DSAF_SCOPE: ${{ inputs.scope }}
        DSAF_OUT_DIR: ${{ inputs.out-dir }}
        DSAF_SARIF_FILE: ${{ inputs.sarif-file }}
        DSAF_VERSION: ${{ inputs.dsaf-version }}
        DSAF_ACTION_PATH: ${{ github.action_path }}
      run: |
        set +e
        mkdir -p "$DSAF_OUT_DIR"
        SUMMARY_JSON="${DSAF_OUT_DIR}/audit-summary.json"
        SUMMARY_MD="${DSAF_OUT_DIR}/audit-summary.md"
        rm -f "$SUMMARY_JSON" "$SUMMARY_MD"
        SCOPE_JSON=$(node -e '
          const fs = require("node:fs");
          const path = require("node:path");
          const repoRoot = fs.realpathSync(process.cwd());
          const rawTarget = (process.env.DSAF_TARGET || ".").trim() || ".";
          const rawScope = (process.env.DSAF_SCOPE || "").trim();
          const norm = (p) => (process.platform === "darwin" || process.platform === "win32" ? p.toLowerCase() : p);
          const isWithin = (root, child) => {
            const r = path.relative(norm(root), norm(child));
            return r === "" || (r !== ".." && !r.startsWith(".." + path.sep) && !path.isAbsolute(r));
          };
          const absTarget = path.resolve(repoRoot, rawTarget);
          let cliTarget = rawTarget;
          let cliScope = rawScope;
          if (fs.existsSync(absTarget) && fs.statSync(absTarget).isDirectory()) {
            const realTarget = fs.realpathSync(absTarget);
            const relTarget = path.relative(repoRoot, realTarget).replace(/\\/g, "/");
            if (isWithin(repoRoot, realTarget) && relTarget !== "" && !relTarget.startsWith("..")) {
              cliTarget = ".";
              if (rawScope) {
                const absScope = path.resolve(realTarget, rawScope);
                if (!isWithin(realTarget, absScope)) {
                  console.error(`ERROR: Input '\''scope'\'' ('\''${rawScope}'\'') escapes target '\''${rawTarget}'\''.`);
                  process.exit(2);
                }
                const effScope = fs.existsSync(absScope) ? fs.realpathSync(absScope) : absScope;
                if (!isWithin(realTarget, effScope)) {
                  console.error(`ERROR: Resolved input '\''scope'\'' ('\''${rawScope}'\'') escapes target '\''${rawTarget}'\'' via symlink.`);
                  process.exit(2);
                }
                cliScope = path.relative(repoRoot, effScope).replace(/\\/g, "/") || relTarget;
              } else {
                cliScope = relTarget;
              }
            }
          }
          process.stdout.write(JSON.stringify([cliTarget, cliScope]));
        ')
        SCOPE_PARSE_EXIT=$?
        if [ "$SCOPE_PARSE_EXIT" -eq 0 ]; then
          EFFECTIVE_TARGET=$(node -e 'process.stdout.write(JSON.parse(process.argv[1])[0])' "$SCOPE_JSON")
          EFFECTIVE_SCOPE=$(node -e 'process.stdout.write(JSON.parse(process.argv[1])[1])' "$SCOPE_JSON")
          ARGS=(audit "$EFFECTIVE_TARGET" --out "$DSAF_OUT_DIR" --github --report-unused-ignores)
          if [ -n "$DSAF_SARIF_FILE" ]; then
            rm -f "$DSAF_SARIF_FILE"
            if [[ "$DSAF_SARIF_FILE" != /* ]]; then
              rm -f "${DSAF_OUT_DIR}/${DSAF_SARIF_FILE}"
            fi
            ARGS+=(--sarif "$DSAF_SARIF_FILE")
          fi
          if [ -n "$EFFECTIVE_SCOPE" ]; then
            ARGS+=(--scope "$EFFECTIVE_SCOPE")
          fi
          CLI_CMD=()
          if [ -n "${DSAF_CLI_BIN:-}" ] && [ -f "${DSAF_CLI_BIN}" ]; then
            CLI_CMD=(node "$DSAF_CLI_BIN")
          elif [ "$DSAF_VERSION" = "bundled" ] || [ -z "$DSAF_VERSION" ]; then
            CLI_CMD=(node "${DSAF_ACTION_PATH}/bin/dsaf.mjs")
          else
            CLI_CMD=(npx --yes "@zintaen/dsaf@${DSAF_VERSION}")
          fi
          "${CLI_CMD[@]}" "${ARGS[@]}"
          AUDIT_EXIT=$?
        else
          AUDIT_EXIT=$SCOPE_PARSE_EXIT
        fi
        set -e

        SARIF_PATH=""
        SARIF_EXISTS="false"
        if [ -n "$DSAF_SARIF_FILE" ]; then
          if [ -f "$DSAF_SARIF_FILE" ]; then
            SARIF_PATH="$DSAF_SARIF_FILE"
            SARIF_EXISTS="true"
          elif [[ "$DSAF_SARIF_FILE" != /* ]] && [ -f "${DSAF_OUT_DIR}/${DSAF_SARIF_FILE}" ]; then
            SARIF_PATH="${DSAF_OUT_DIR}/${DSAF_SARIF_FILE}"
            SARIF_EXISTS="true"
          fi
        fi

        UPDATE_NOTICE=""
        if [ "${DSAF_NO_UPDATE_CHECK:-}" != "1" ] && [ "${DSAF_NO_UPDATE_CHECK:-}" != "true" ] && [ -f "${DSAF_ACTION_PATH}/skill/scripts/update-check.mjs" ]; then
          RUNNING_VER=$(node -e 'try{const fs=require("node:fs");const s=process.argv[1];const p=process.argv[2];let v="";if(s&&fs.existsSync(s)){try{v=String(JSON.parse(fs.readFileSync(s,"utf8")).engine_version||"")}catch{}}if(!v&&p&&fs.existsSync(p)){try{v=String(JSON.parse(fs.readFileSync(p,"utf8")).version||"")}catch{}}console.log(v)}catch{}' "$SUMMARY_JSON" "${DSAF_ACTION_PATH}/package.json")
          UPD_JSON=$(node "${DSAF_ACTION_PATH}/skill/scripts/update-check.mjs" --json 2>/dev/null || true)
          UPDATE_NOTICE=$(DSAF_UPD_JSON="$UPD_JSON" DSAF_RUNNING_VER="$RUNNING_VER" DSAF_UPD_MOD="${DSAF_ACTION_PATH}/skill/scripts/update-check.mjs" node --input-type=module -e '
            import { pathToFileURL } from "node:url";
            try {
              const { parseSemver, compareSemver } = await import(pathToFileURL(process.env.DSAF_UPD_MOD).href);
              const d = JSON.parse(process.env.DSAF_UPD_JSON || "{}");
              const running = (process.env.DSAF_RUNNING_VER || d.currentVersion || "").trim();
              const latest = String(d.latestVersion || "").trim();
              const newer = latest && parseSemver(latest)
                ? (running && parseSemver(running) ? compareSemver(latest, running) === 1 : Boolean(d.outdated))
                : false;
              if (newer) {
                console.log(`DSAF v${latest} is available (running v${running || "unknown"}). Use zintaen/dsaf@v0 or run npx @zintaen/dsaf@latest update.`);
              }
            } catch {}
          ')
          if [ -n "$UPDATE_NOTICE" ]; then
            echo "::notice title=DSAF Update Available::${UPDATE_NOTICE}"
          fi
        fi

        echo "audit-exit=${AUDIT_EXIT}" >> "$GITHUB_OUTPUT"
        echo "summary-json=${SUMMARY_JSON}" >> "$GITHUB_OUTPUT"
        echo "summary-md=${SUMMARY_MD}" >> "$GITHUB_OUTPUT"
        echo "sarif-path=${SARIF_PATH}" >> "$GITHUB_OUTPUT"
        echo "sarif-exists=${SARIF_EXISTS}" >> "$GITHUB_OUTPUT"
        echo "update-notice=${UPDATE_NOTICE}" >> "$GITHUB_OUTPUT"

        node - "$SUMMARY_JSON" "$GITHUB_OUTPUT" <<'EOF'
        const fs = require("node:fs");
        const [summaryPath, outPath] = process.argv.slice(2);
        let floor = 0;
        let reflex = 0;
        if (fs.existsSync(summaryPath)) {
          const data = JSON.parse(fs.readFileSync(summaryPath, "utf8"));
          const counts = data.ciGate || data.ci?.counts || data.tokens?.ciFindings?.counts || {};
          floor = Number(counts.floor || 0);
          reflex = Number(counts.reflex || 0);
        }
        fs.appendFileSync(outPath, `floor-count=${floor}\nreflex-count=${reflex}\n`);
        EOF
        if [ "$AUDIT_EXIT" -ge 2 ] || { [ "$AUDIT_EXIT" -ne 0 ] && [ ! -f "$SUMMARY_JSON" ]; }; then
          echo "::error::DSAF audit failed with fatal error (audit-exit=${AUDIT_EXIT}, summary missing or config error)."
          exit "$AUDIT_EXIT"
        fi

    - name: Run DSAF Doctor (optional)
      id: doctor
      if: inputs.run-doctor == 'true'
      shell: bash
      env:
        DSAF_TARGET: ${{ inputs.target }}
        DSAF_SCOPE: ${{ inputs.scope }}
        DSAF_OUT_DIR: ${{ inputs.out-dir }}
        DSAF_VERSION: ${{ inputs.dsaf-version }}
        DSAF_ACTION_PATH: ${{ github.action_path }}
      run: |
        set +e
        mkdir -p "$DSAF_OUT_DIR"
        DOCTOR_JSON="${DSAF_OUT_DIR}/doctor.json"
        rm -f "$DOCTOR_JSON"
        DOC_SCOPE_JSON=$(node -e '
          const fs = require("node:fs");
          const path = require("node:path");
          const repoRoot = fs.realpathSync(process.cwd());
          const rawTarget = (process.env.DSAF_TARGET || ".").trim() || ".";
          const rawScope = (process.env.DSAF_SCOPE || "").trim();
          const norm = (p) => (process.platform === "darwin" || process.platform === "win32" ? p.toLowerCase() : p);
          const isWithin = (root, child) => {
            const r = path.relative(norm(root), norm(child));
            return r === "" || (r !== ".." && !r.startsWith(".." + path.sep) && !path.isAbsolute(r));
          };
          const absTarget = path.resolve(repoRoot, rawTarget);
          let cliTarget = rawTarget;
          let cliScope = rawScope;
          if (fs.existsSync(absTarget) && fs.statSync(absTarget).isDirectory()) {
            const realTarget = fs.realpathSync(absTarget);
            const relTarget = path.relative(repoRoot, realTarget).replace(/\\/g, "/");
            if (isWithin(repoRoot, realTarget) && relTarget !== "" && !relTarget.startsWith("..")) {
              cliTarget = ".";
              if (rawScope) {
                const absScope = path.resolve(realTarget, rawScope);
                if (!isWithin(realTarget, absScope)) {
                  console.error(`ERROR: Input '\''scope'\'' ('\''${rawScope}'\'') escapes target '\''${rawTarget}'\''.`);
                  process.exit(2);
                }
                const effScope = fs.existsSync(absScope) ? fs.realpathSync(absScope) : absScope;
                if (!isWithin(realTarget, effScope)) {
                  console.error(`ERROR: Resolved input '\''scope'\'' ('\''${rawScope}'\'') escapes target '\''${rawTarget}'\'' via symlink.`);
                  process.exit(2);
                }
                cliScope = path.relative(repoRoot, effScope).replace(/\\/g, "/") || relTarget;
              } else {
                cliScope = relTarget;
              }
            }
          }
          process.stdout.write(JSON.stringify([cliTarget, cliScope]));
        ')
        DOC_SCOPE_EXIT=$?
        if [ "$DOC_SCOPE_EXIT" -eq 0 ]; then
          DOC_EFFECTIVE_TARGET=$(node -e 'process.stdout.write(JSON.parse(process.argv[1])[0])' "$DOC_SCOPE_JSON")
          DOC_EFFECTIVE_SCOPE=$(node -e 'process.stdout.write(JSON.parse(process.argv[1])[1])' "$DOC_SCOPE_JSON")
          DOCTOR_ARGS=(doctor "$DOC_EFFECTIVE_TARGET" --out "$DOCTOR_JSON")
          if [ -n "$DOC_EFFECTIVE_SCOPE" ]; then
            DOCTOR_ARGS+=(--scope "$DOC_EFFECTIVE_SCOPE")
          fi
          if [ -n "${DSAF_CLI_BIN:-}" ] && [ -f "${DSAF_CLI_BIN}" ]; then
            node "$DSAF_CLI_BIN" "${DOCTOR_ARGS[@]}"
          elif [ "$DSAF_VERSION" = "bundled" ] || [ -z "$DSAF_VERSION" ]; then
            node "${DSAF_ACTION_PATH}/bin/dsaf.mjs" "${DOCTOR_ARGS[@]}"
          else
            npx --yes "@zintaen/dsaf@${DSAF_VERSION}" "${DOCTOR_ARGS[@]}"
          fi
          DOCTOR_EXIT=$?
        else
          DOCTOR_EXIT=$DOC_SCOPE_EXIT
        fi
        set -e
        echo "doctor-exit=${DOCTOR_EXIT}" >> "$GITHUB_OUTPUT"
        if [ "$DOCTOR_EXIT" -ge 2 ] || { [ "$DOCTOR_EXIT" -ne 0 ] && [ ! -f "$DOCTOR_JSON" ]; }; then
          echo "::error::DSAF doctor failed with fatal error (doctor-exit=${DOCTOR_EXIT}, doctor.json missing or config error)."
          exit "$DOCTOR_EXIT"
        fi
        if [ "$DOCTOR_EXIT" -ne 0 ]; then
          echo "::warning::DSAF Doctor reported active Floor defects (exit=${DOCTOR_EXIT})."
        fi

    - name: Upload SARIF 2.1.0 to GitHub Code Scanning
      if: inputs.upload-sarif == 'true' && steps.audit.outputs.sarif-exists == 'true'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.audit.outputs.sarif-path }}
        category: dsaf-audit

    - name: Post Sticky Pull Request Summary
      if: github.event_name == 'pull_request' && inputs.comment-pr == 'true'
      continue-on-error: true
      uses: actions/github-script@v9
      env:
        SUMMARY_MD: ${{ steps.audit.outputs.summary-md }}
        FLOOR_COUNT: ${{ steps.audit.outputs.floor-count }}
        REFLEX_COUNT: ${{ steps.audit.outputs.reflex-count }}
        UPDATE_NOTICE: ${{ steps.audit.outputs.update-notice }}
      with:
        script: |
          const fs = require("node:fs");
          const marker = "<!-- dsaf-audit-comment -->";
          const mdPath = process.env.SUMMARY_MD;
          if (!mdPath || !fs.existsSync(mdPath)) return;
          const raw = fs.readFileSync(mdPath, "utf8");
          const clipped = raw.length > 60000 ? raw.slice(0, 60000) + "\n\n*(Truncated by DSAF Action)*" : raw;
          const updTip = process.env.UPDATE_NOTICE ? `\n\n> **Update notice:** ${process.env.UPDATE_NOTICE}` : "";
          const body = `${marker}\n### DSAF Audit Summary (Floor: ${process.env.FLOOR_COUNT}, Reflex: ${process.env.REFLEX_COUNT})\n\n${clipped}${updTip}`;
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
          const existing = comments.find((c) => (c.body || "").includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Enforce Floor Gate
      if: inputs.fail-on-floor == 'true'
      shell: bash
      env:
        AUDIT_EXIT: ${{ steps.audit.outputs.audit-exit }}
        FLOOR_COUNT: ${{ steps.audit.outputs.floor-count }}
        DOCTOR_EXIT: ${{ steps.doctor.outputs.doctor-exit }}
      run: |
        if [ "${FLOOR_COUNT:-0}" -gt 0 ] || [ "${AUDIT_EXIT:-0}" -ne 0 ] || [ "${DOCTOR_EXIT:-0}" -ne 0 ]; then
          echo "::error::DSAF Floor gate failed (audit-exit=${AUDIT_EXIT}, floor=${FLOOR_COUNT}, doctor-exit=${DOCTOR_EXIT:-0})."
          exit 1
        fi
