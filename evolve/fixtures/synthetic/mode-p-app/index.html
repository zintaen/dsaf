<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Standalone Product Fixture (Mode P)</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #f8fafc;
      color: #0f172a;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      overflow-x: clip;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    /* Two intentionally distinct N-of-1 button signatures that still pass 44px touch & 3:1 borders */
    .btn-primary {
      min-height: 44px;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      border: 1px solid #1e40af;
      background: #1d4ed8;
      color: #ffffff;
      cursor: pointer;
    }
    .btn-pill {
      min-height: 52px;
      padding: 12px 22px;
      border-radius: 26px;
      font-size: 16px;
      font-weight: 600;
      border: 2px solid #334155;
      background: #ffffff;
      color: #0f172a;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Quarterly Ledger</h1>
    <p>Standalone product fixture lacking a formal design system tokens layer.</p>
    <div class="row">
      <button type="button" class="btn-primary">Create Entry</button>
      <button type="button" class="btn-pill">Export CSV</button>
    </div>
  </main>
</body>
</html>
